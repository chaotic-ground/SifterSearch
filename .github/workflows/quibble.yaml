---
name: Quibble

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Cancel superseded runs; pushes to main are left to finish, keeping a result per merged commit.
# Worth more here than elsewhere: every stage boots a full MediaWiki checkout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # One matrix for all the MediaWiki-toolchain checks. composer-test (phpcs +
  # minus-x) runs directly, since Quibble has no phpcs stage; npm-test (grunt:
  # eslint, stylelint, banana), phpunit, and phan run inside a MediaWiki checkout
  # via Quibble, which phan needs to resolve core symbols.
  test:
    strategy:
      fail-fast: false
      matrix:
        stage: [composer-test, npm-test, phan, phpunit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.stage == 'composer-test'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      # mediawiki-phan-config (used only by the phan stage) pulls in phan, which
      # requires ext-ast; phpcs and minus-x do not need it.
      - if: matrix.stage == 'composer-test'
        run: composer install --no-interaction --no-progress --ignore-platform-req=ext-ast
      - if: matrix.stage == 'composer-test'
        run: composer phpcs
      - if: matrix.stage == 'composer-test'
        run: composer test

      - if: matrix.stage != 'composer-test'
        uses: femiwiki/quibble-action@d799e5bb348756ea1588f2b5f2ca7fc09fdbdac9  # v2.0.1
        with:
          stage: ${{ matrix.stage }}
          # SifterSearch targets MediaWiki 1.45 (extension.json), whose namespaced
          # types (e.g. MediaWiki\JobQueue\Job) the code uses.
          mediawiki-version: REL1_45
          # PHP 8.3 image, matching the composer dev deps (which require >= 8.2).
          # phan itself runs in the action's default mediawiki-phan-testrun image
          # (php-ast 1.1.3, the maintained one).
          quibble-docker-image: quibble-bookworm-php83
