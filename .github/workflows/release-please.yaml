---
name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Phase 1: create the GitHub release for a merged release PR only. The release
  # is a draft (see release-please-config.json), so no git tag exists yet; it is
  # created when the publish job un-drafts it below. The next release PR is NOT
  # computed here (skip-github-pull-request): doing so in this same run would find
  # no tag for the release just created and mis-bootstrap the next PR to 0.1.0.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          skip-github-pull-request: true

  package:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/package.yaml
    with:
      tag: ${{ needs.release.outputs.tag_name }}

  publish:
    needs: [release, package]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish (un-draft) the release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false

  # Phase 2: open/refresh the next release PR only (skip-github-release). Runs
  # after publish so that, when a release was just cut, its tag already exists and
  # release-please computes the next PR from the correct baseline. Also runs on
  # ordinary pushes (when package/publish are skipped) to keep the release PR up
  # to date; !failure() lets it proceed past those skipped jobs.
  release-pr:
    needs: [release, package, publish]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          skip-github-release: true
