---
name: Updatecli

# The version pins no package manager sees; Dependabot has the rest.
# A pull request opened with GITHUB_TOKEN starts no workflows: close and reopen one to run CI.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  updatecli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e  # v3.10.0
        with:
          version: v0.120.1

      - run: updatecli pipeline apply --config updatecli/updatecli.d
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
