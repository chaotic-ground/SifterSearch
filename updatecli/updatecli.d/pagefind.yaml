---
name: "build(deps): bump Pagefind"
pipelineid: pagefind

scms:
  default:
    kind: github
    spec:
      owner: chaotic-ground
      repository: SifterSearch
      branch: main
      user: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      labels:
        - dependencies

sources:
  release:
    name: Latest Pagefind release
    kind: githubrelease
    spec:
      owner: Pagefind
      repository: pagefind
      versionfilter:
        kind: semver

targets:
  # Package downloads the pagefind_extended binary for every platform at this version.
  workflow:
    name: 'build(deps): bump Pagefind to {{ source "release" }}'
    kind: file
    scmid: default
    sourceid: release
    spec:
      file: .github/workflows/package.yaml
      matchpattern: 'PAGEFIND_VERSION: v[0-9.]+'
      replacepattern: 'PAGEFIND_VERSION: {{ source "release" }}'
