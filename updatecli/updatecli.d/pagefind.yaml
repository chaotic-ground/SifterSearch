---
name: "build(deps): bump Pagefind"
pipelineid: pagefind

scms:
  default:
    kind: github
    spec:
      owner: chaotic-ground
      repository: SifterSearch
      branch: main
      user: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      labels:
        - dependencies

sources:
  release:
    name: Latest Pagefind release
    kind: githubrelease
    spec:
      owner: Pagefind
      repository: pagefind
      versionfilter:
        kind: semver
    # Releases are tagged v1.6.0; Package puts the "v" back when it builds the download URL.
    transformers:
      - trimprefix: v

targets:
  # Package downloads the pagefind_extended binary for every platform at this version.
  tool-versions:
    name: 'build(deps): bump Pagefind to {{ source "release" }}'
    kind: file
    scmid: default
    sourceid: release
    spec:
      file: .tool-versions
      matchpattern: '(?m)^pagefind .*$'
      replacepattern: 'pagefind {{ source "release" }}'
